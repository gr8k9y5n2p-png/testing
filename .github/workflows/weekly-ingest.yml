name: Weekly ingest refresh

on:
  schedule:
    # Sunday scrape (NAV + estimates) and Monday follow-up, 14:00 UTC ≈ 9am America/Chicago.
    # Follow-up (do not flip here): lock target is Sunday 06:00 America/Chicago.
    # Soft-beta schedule stays until Eric aligns cron after Postgres cutover.
    - cron: "0 14 * * 0"
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: live (then fixture fallback), fixture only, or auto
        required: false
        default: auto
        type: choice
        options:
          - auto
          - live
          - fixture

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Configure database
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p data
          if [ -n "$SECRET_DATABASE_URL" ]; then
            echo "Using Postgres from DATABASE_URL secret (psycopg3 via requirements.txt)"
            echo "DATABASE_URL=$SECRET_DATABASE_URL" >> "$GITHUB_ENV"
          else
            echo "No DATABASE_URL secret; using local SQLite"
            echo "DATABASE_URL=sqlite:///./data/distributions.db" >> "$GITHUB_ENV"
          fi

      - name: Refresh all fund families
        env:
          REFRESH_MODE: ${{ github.event.inputs.refresh_mode || 'auto' }}
        run: |
          python -m app.cli refresh \
            --output refresh-summary.json \
            --markdown refresh-summary.md

      - name: Refresh weekly NAV for every listed ticker
        env:
          REFRESH_MODE: ${{ github.event.inputs.refresh_mode || 'auto' }}
        run: |
          python -m app.cli refresh-nav \
            --output nav-summary.json \
            --markdown nav-summary.md

      - name: Pick up queued ticker requests
        env:
          REFRESH_MODE: ${{ github.event.inputs.refresh_mode || 'auto' }}
        run: |
          python -m app.cli ticker-requests \
            --output ticker-request-summary.json

      - name: Job summary
        if: always()
        run: |
          if [ -f refresh-summary.md ]; then
            cat refresh-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Refresh did not write a Markdown summary." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f nav-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat nav-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ticker-request-summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Queued ticker-request pickup" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ticker-request-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ingest-summary
          path: |
            refresh-summary.json
            refresh-summary.md
            nav-summary.json
            nav-summary.md
            ticker-request-summary.json
          if-no-files-found: warn
