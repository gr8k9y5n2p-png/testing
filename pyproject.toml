[project]
name = "fund-distribution-estimates"
version = "1.0.0"
description = "API to ingest and search fund-manager taxable distribution estimates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0,<0.36",
  "sqlalchemy>=2.0.36,<2.1",
  "pydantic>=2.10.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "httpx>=0.27.0,<0.29",
  "beautifulsoup4>=4.12.0,<5.0",
  "lxml>=5.3.0,<6.0",
  "python-dateutil>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0"]
postgres = ["psycopg[binary]>=3.2.0"]

[project.scripts]
distributions-seed = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
