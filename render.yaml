# Blueprint for a dedicated FastAPI service (do not attach this to the Next.js Website project).
# Dashboard: New → Blueprint → this repo / this branch. Health path is /health.
services:
  - type: web
    name: aftertax-data-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FETCH_MODE
        value: fixture
      - key: SEED_ON_START
        value: "true"
        # Background full fixture ingest (all families). /health stays up; see health.seed.
      - key: DATABASE_URL
        value: sqlite:///./data/distributions.db
      - key: CORS_ORIGINS
        value: https://testing-seven-umber-19.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: CORS_ORIGIN_REGEX
        value: https://([a-z0-9-]+\.)*vercel\.app
