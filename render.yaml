# LIVE soft-beta Blueprint. Do not point DATABASE_URL at Postgres here.
# Cutover is gated: docs/CUTOVER.md + docs/render.postgres-launch.example.yaml
# (Eric Merge + Manual Deploy). Merging this file must keep SQLite + /var/data.
#
# Blueprint for a dedicated FastAPI service (do not attach this to the Next.js Website project).
# Dashboard: New → Blueprint → this repo / this branch. Health path is /health.
# Disk keeps the SQLite book across deploys (ephemeral filesystem otherwise).
# plan: starter is required for persistent disks (free web services cannot attach one).
services:
  - type: web
    name: aftertax-data-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: aftertax-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FETCH_MODE
        value: fixture
      - key: SEED_ON_START
        value: "true"
        # Background seed. Empty disk: full fixture book. Warm /var/data disk:
        # densify missing families / changed fixture files only (no full rebuild).
        # /health is liveness (200 as soon as HTTP listens). See README Render notes.
      - key: SEED_FORCE_FULL
        value: "false"
        # Set true only to rebuild every family from fixtures on next boot.
      - key: DATABASE_URL
        value: sqlite:////var/data/distributions.db
      - key: WEB_CONCURRENCY
        value: "1"
        # Single uvicorn worker. Multiple workers on one /var/data SQLite file
        # lock the book and return 502s under concurrent /funds.
      - key: CORS_ORIGINS
        value: https://testing-seven-umber-19.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: CORS_ORIGIN_REGEX
        value: https://([a-z0-9-]+\.)*vercel\.app
      - key: CATEGORY_OUTLIER_THRESHOLD_PCT
        value: "50"
      - key: CATEGORY_OUTLIER_MIN_PEERS
        value: "3"
