# Default: SQLite soft-beta path (friends / local).
#   docker compose up --build
#
# Local Postgres (does not change production Render):
#   docker compose --profile postgres up --build
#   DATABASE_URL=postgresql+psycopg://distributions:distributions@localhost:5432/distributions
#   alembic upgrade head
# Then point the API at that URL, or use the api-pg service on port 8001.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/distributions.db
      FETCH_MODE: fixture
      SEED_ON_START: "true"
      WEB_CONCURRENCY: "1"
      CORS_ORIGINS: https://testing-seven-umber-19.vercel.app,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - dist-data:/app/data

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: distributions
      POSTGRES_PASSWORD: distributions
      POSTGRES_DB: distributions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributions -d distributions"]
      interval: 5s
      timeout: 5s
      retries: 8
    volumes:
      - pg-data:/var/lib/postgresql/data

  api-pg:
    profiles: ["postgres"]
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://distributions:distributions@postgres:5432/distributions
      FETCH_MODE: fixture
      SEED_ON_START: "true"
      SEED_FORCE_FULL: "false"
      WEB_CONCURRENCY: "2"
      CORS_ORIGINS: https://testing-seven-umber-19.vercel.app,http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000} --workers $${WEB_CONCURRENCY:-2}

volumes:
  dist-data:
  pg-data:
